name: Release

# Two independent artifacts, both keyed to the same version:
#   1. Runtime Docker image (deps shell only) — rebuilt when uv.lock /
#      deploy/runtime change, or on a tag. Source is NOT baked in.
#   2. sathop-bundle.tar.gz (backend src + uv.lock + pyproject + prebuilt
#      frontend/dist) — one self-contained package per tag, uploaded as a
#      Release asset. The entrypoint downloads + extracts it at boot. Frontend
#      and backend ship together, so they can never drift.

on:
  push:
    branches: [main]
    paths: [uv.lock, "deploy/runtime/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-lock:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff HEAD~1 --name-only | grep -qE '^(uv\.lock|deploy/runtime/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: check-lock
    if: |
      always() && (
        needs.check-lock.outputs.changed == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/runtime
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  bundle:
    # One self-contained tarball per tag: backend source + deps manifest +
    # prebuilt frontend, so a deployed version can't have a mismatched UI.
    # Published as a PRERELEASE (the edge channel); a stable release is made by
    # running the Promote workflow, which clears the prerelease flag. Edge nodes
    # (SATHOP_CHANNEL=edge) see it immediately; stable nodes only after promotion.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Package bundle
        run: tar -czf sathop-bundle.tar.gz src pyproject.toml uv.lock frontend/dist
      - name: Sign bundle (ed25519 / minisign)
        # The entrypoint refuses any bundle whose signature does not verify against
        # the public key baked into the runtime image, so a missing secret must
        # fail the release rather than ship an unsigned (un-installable) bundle.
        env:
          MINISIGN_KEY: ${{ secrets.SATHOP_MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::error::SATHOP_MINISIGN_KEY is not set — refusing to publish an unsigned bundle"; exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_KEY" > seckey
          minisign -S -s seckey -m sathop-bundle.tar.gz -t "sathop ${GITHUB_REF_NAME}"
          rm -f seckey
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            sathop-bundle.tar.gz
            sathop-bundle.tar.gz.minisig
