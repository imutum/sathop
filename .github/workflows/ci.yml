name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Style is OS-independent; one runner is enough. Fails fast (~30s) so
    # a bad format doesn't burn the whole matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install ruff
        run: uv sync --group dev --no-install-workspace
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    # Pyright on src/ only — pyrightconfig.json's "include" scopes the check
    # so we don't drag in test-only patterns. Runs against full deps (typed
    # transitive deps matter for inference) but isn't gated on tests passing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync workspace (prod + dev deps)
        run: uv sync --all-extras --dev
      - name: pyright
        run: uv tool run pyright src

  gitleaks:
    # Scan full history for accidentally committed secrets. Uses the gitleaks
    # binary directly (not gitleaks-action) so it works for both public and
    # private repos without the GITLEAKS_LICENSE requirement.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan repo
        run: gitleaks detect --redact --no-banner --verbose

  tests:
    # Linux-only: production runs in Linux containers (deploy/*/Dockerfile),
    # Windows is only a dev convenience. The Windows runner was 5–6× slower
    # than Linux (~3 min vs ~30 s) and caught no real regressions in
    # practice — Windows-specific code paths (venv Scripts/ vs bin/,
    # cmd.exe $VAR non-expansion, path separators) get exercised by local
    # dev on Win machines before push.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pin Python to match the Docker images.
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            */pyproject.toml

      - name: Sync workspace (prod + dev deps)
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest -v --tb=short
        env:
          PYTHONUNBUFFERED: "1"

  e2e-scale:
    # The single-process SQLite `tests` job cannot catch the multi-process +
    # Postgres regression class (event-loop blocking from sync calls on the loop
    # or unbounded read-path scans — the 0.9.0/0.9.1 health spikes that a
    # single-process preview missed). Boot a REAL multi-process orchestrator
    # against a Postgres service and drive the full pending→delivered pipeline at
    # volume while sampling /api/health: a blocked loop spikes p95 ~100×.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sathop
          POSTGRES_PASSWORD: sathop
          POSTGRES_DB: sathop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sathop -d sathop"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SATHOP_DATABASE_URL: postgresql+asyncpg://sathop:sathop@localhost:5432/sathop
      SATHOP_ORCH_WORKERS: "2"
      SATHOP_PORT: "8000"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Sync orchestrator deps
        run: uv sync --extra orchestrator
      - name: Boot multi-process orchestrator + pipeline load test + /api/health gate
        run: |
          set -e
          uv run sathop-orchestrator > orch.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null \
            || { echo "orchestrator did not become healthy"; cat orch.log; exit 1; }
          # Guard against silent single-process degrade: run() forces workers=1
          # unless a Postgres URL is active, so <2 server processes means the
          # multi-process/PG path we mean to exercise never engaged.
          n=$(grep -c "Started server process" orch.log || true)
          echo "uvicorn server processes: $n"
          test "$n" -ge 2 || { echo "not multi-process (got $n) — Postgres path inactive"; cat orch.log; exit 1; }
          uv run python scripts/loadtest_orch.py \
            --pg "$SATHOP_DATABASE_URL" --orch http://127.0.0.1:8000 \
            --granules 3000 --workers 12 --receivers 3 --duration 60 --batch \
            --max-health-p95-ms 3000 --max-health-max-ms 10000 --max-errors 100 --min-delivered 300
      - name: Orchestrator log tail
        if: always()
        run: tail -n 80 orch.log || true

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: frontend

      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
