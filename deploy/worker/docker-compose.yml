services:
  # Pinned to known-stable releases — :latest can introduce breaking API
  # changes (MinIO has shipped several over the years). Override per-deploy
  # via SATHOP_MINIO_TAG / SATHOP_ARIA2_TAG in .env when you've validated
  # a newer image.
  minio:
    image: minio/minio:${SATHOP_MINIO_TAG:-RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    command: server /data --console-address :9001
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${SATHOP_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SATHOP_MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./minio-data:/data

  aria2c:
    image: p3terx/aria2-pro:${SATHOP_ARIA2_TAG:-2024.10.20}
    restart: unless-stopped
    environment:
      RPC_SECRET: ${SATHOP_ARIA2_SECRET}
      RPC_PORT: 6800
    volumes:
      - ./aria2-conf:/config
      - ./aria2-downloads:/downloads

  worker:
    image: ${SATHOP_IMAGE:-ghcr.io/imutum/sathop}/worker:${SATHOP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on: [minio, aria2c]
    # Image's baked-in user is UID 10001. Override via SATHOP_UID / SATHOP_GID
    # in .env when the host's `./data` directory is owned by a different UID.
    user: "${SATHOP_UID:-10001}:${SATHOP_GID:-10001}"
    volumes:
      - ./data:/app/data
      - ./aria2-downloads:/downloads
    # SIGTERM ⇒ graceful drain (stop accepting new leases, finish in-flight).
    # 60s matches the worker's drain watchdog; longer downloads/processes that
    # don't finish in time get cut off and the orchestrator's lease sweeper
    # reclaims them on the 30 min lease expiry.
    stop_signal: SIGTERM
    stop_grace_period: 60s
    # /health is served by the worker's progress server (default 9002, bound
    # to 127.0.0.1 inside the container). Curl is available in the base image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
