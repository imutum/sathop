services:
  minio:
    image: minio/minio:${SATHOP_MINIO_TAG:-RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    command: server /data --console-address :9001
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${SATHOP_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SATHOP_MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./minio-data:/data

  aria2c:
    image: p3terx/aria2-pro:${SATHOP_ARIA2_TAG:-2024.10.20}
    restart: unless-stopped
    environment:
      RPC_SECRET: ${SATHOP_ARIA2_SECRET}
      RPC_PORT: 6800
    volumes:
      - ./aria2-conf:/config
      - ./aria2-downloads:/downloads

  worker:
    image: ${SATHOP_IMAGE:-ghcr.io/imutum/sathop}/runtime:${SATHOP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on: [minio, aria2c]
    user: "${SATHOP_UID:-10001}:${SATHOP_GID:-10001}"
    environment:
      SATHOP_ROLE: worker
    volumes:
      - ./data:/app/data
      - ./aria2-downloads:/downloads
      - ./repo:/app/repo
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
