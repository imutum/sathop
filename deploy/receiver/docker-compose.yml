services:
  receiver:
    image: ${SATHOP_IMAGE:-ghcr.io/imutum/sathop}/runtime:${SATHOP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    user: "${SATHOP_UID:-10001}:${SATHOP_GID:-10001}"
    environment:
      SATHOP_ROLE: receiver
      SATHOP_STORAGE_DIR: /data/archive
    volumes:
      - ${RECEIVER_HOST_ARCHIVE:-./archive}:/data/archive
      - ./repo:/app/repo
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9003/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
