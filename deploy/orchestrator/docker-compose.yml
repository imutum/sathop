services:
  orchestrator:
    image: ${SATHOP_IMAGE:-ghcr.io/imutum/sathop}/runtime:${SATHOP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    user: "${SATHOP_UID:-10001}:${SATHOP_GID:-10001}"
    environment:
      SATHOP_ROLE: orchestrator
    ports:
      - "${SATHOP_PORT:-8000}:${SATHOP_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./repo:/app/repo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SATHOP_PORT:-8000}/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
