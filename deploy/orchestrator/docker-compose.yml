services:
  orchestrator:
    image: ${SATHOP_IMAGE:-ghcr.io/imutum/sathop}/runtime:${SATHOP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    user: "${SATHOP_UID:-10001}:${SATHOP_GID:-10001}"
    environment:
      SATHOP_ROLE: orchestrator
      # Single-process SQLite by default (state in ./data). To scale onto N cores:
      # set SATHOP_DATABASE_URL (a postgresql+asyncpg:// URL) + SATHOP_ORCH_WORKERS=N
      # in .env and bring the stack up with `--profile scale` so the postgres
      # service below starts too. Postgres then holds ALL authoritative state and
      # the cross-process pub/sub (LISTEN/NOTIFY) — no Redis. See .env.example.
      SATHOP_DATABASE_URL: ${SATHOP_DATABASE_URL:-}
      SATHOP_ORCH_WORKERS: ${SATHOP_ORCH_WORKERS:-1}
    ports:
      - "${SATHOP_PORT:-8000}:${SATHOP_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./repo:/app/repo
    depends_on:
      postgres:
        condition: service_healthy
        # Only required when the `scale` profile is active; a plain
        # single-process `docker compose up` skips postgres entirely.
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SATHOP_PORT:-8000}/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Authoritative state store + cross-process pub/sub for the multi-process
  # orchestrator (route A). Unlike the old ephemeral redis, this holds the WHOLE
  # DB, so its volume is PRECIOUS — back ./pgdata up like you would ./data.
  # Started only under `--profile scale`; idle/absent for the single-process
  # default. Migrate existing SQLite state into it before first multi-process
  # boot (see scripts/migrate_sqlite_to_pg.py).
  postgres:
    image: postgres:16-alpine
    profiles: ["scale"]
    restart: unless-stopped
    # Docker's default /dev/shm is 64MB; parallel VACUUM / large sorts spill there
    # and fail with "No space left on device". 256MB is ample for this workload.
    shm_size: "256mb"
    environment:
      POSTGRES_USER: ${SATHOP_PG_USER:-sathop}
      POSTGRES_PASSWORD: ${SATHOP_PG_PASSWORD:?set SATHOP_PG_PASSWORD in .env to enable multi-process}
      POSTGRES_DB: ${SATHOP_PG_DB:-sathop}
    # Conservative GUCs for a small shared box (memory-tight). Per-table autovacuum
    # aggressiveness + fillfactor live in code (db.py::_ensure_pg_table_tuning) so
    # they survive a fresh-PG migration; these are the cluster-wide knobs.
    # idle_in_transaction_session_timeout is a belt-and-suspenders backstop: the
    # leader idle-in-txn leak that pinned xmin is fixed in code, but any future
    # stray long-lived transaction gets reaped after 5min instead of bloating the
    # heap. Override any of these via SATHOP_PG_* in .env.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${SATHOP_PG_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${SATHOP_PG_EFFECTIVE_CACHE:-2GB}"
      - "-c"
      - "work_mem=${SATHOP_PG_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${SATHOP_PG_MAINT_WORK_MEM:-128MB}"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "idle_in_transaction_session_timeout=${SATHOP_PG_IDLE_TXN_TIMEOUT_MS:-300000}"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SATHOP_PG_USER:-sathop} -d ${SATHOP_PG_DB:-sathop}"]
      interval: 10s
      timeout: 3s
      retries: 5
